project_name: structura
run_name: eval-smoke
prompt_template: instruction

logging:
  level: INFO
  debug_samples: 5
  log_every: 25
  error_sample_limit: 25

data:
  test_path: data/structura/processed/test.jsonl
  max_input_length: 1024

generation:
  max_new_tokens: 512
  num_beams: 1
  do_sample: false
  temperature: 0.0

outputs:
  predictions_path: data/structura/predictions/predictions.jsonl
  metrics_path: outputs/structura/metrics.json
