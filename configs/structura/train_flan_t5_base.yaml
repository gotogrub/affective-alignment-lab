project_name: structura
run_name: flan-t5-base-v1
model_name: google/flan-t5-base
prompt_template: instruction

data:
  train_path: data/structura/processed/train.jsonl
  valid_path: data/structura/processed/valid.jsonl
  test_path: data/structura/processed/test.jsonl

training:
  output_dir: outputs/structura/flan-t5-base-v1
  num_train_epochs: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.00003
  weight_decay: 0.01
  warmup_ratio: 0.03
  fp16: false
  bf16: auto
  max_grad_norm: 1.0
  logging_nan_inf_filter: false
  overwrite_output_dir: true
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 1
  save_only_model: true
  save_optimizer_state: false
  save_safetensors: true
  max_input_length: 1024
  max_target_length: 512
  report_to: none

generation:
  max_new_tokens: 512
  num_beams: 1
  do_sample: false
  temperature: 0.0
