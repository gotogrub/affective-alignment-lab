name: Structura CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU validation dependencies
        run: |
          python -m pip install --requirement requirements-structura-data.lock
          python -m pip install pytest==8.3.4
          python -m pip install --no-deps --editable .
      - name: Run Structura tests
        run: pytest tests/structura -q
      - name: Validate worker source
        run: python -m compileall -q src/structura scripts/structura
      - name: Reproduce audited dataset and rules baseline
        run: dvc repro
      - name: Require a clean DVC pipeline
        run: |
          dvc status
          git diff --exit-code -- dvc.lock
